<html lang="es">

    <style>
        :root {
            --bg-main: #ffffff;
            --bg-secondary: #f4f5f7;
            --text-primary: #0a0a0a;
            --text-secondary: #52525b;
            --border: #e4e4e7;
            --accent: #000000;
            --wsp: #25d366;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.5;
        }

        /* TOP BAR */
        .top-bar {
            background: var(--text-primary);
            color: #fff;
            text-align: center;
            font-size: 0.78rem;
            font-weight: 600;
            padding: 8px 5%;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* HEADER */
        header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            text-decoration: none;
            color: var(--text-primary);
            font-size: 1.5rem;
            font-weight: 800;
            letter-spacing: -0.04em;
        }

        .logo span {
            color: #71717a;
            font-weight: 500;
        }

        nav {
            display: flex;
            gap: 2rem;
            align-items: center;
        }

        nav a {
            text-decoration: none;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
            transition: color 0.2s;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        nav a:hover {
            color: var(--text-primary);
        }

        .cart-btn {
            background: var(--text-primary);
            color: #fff;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 8px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: opacity 0.2s;
        }

        .cart-btn:hover {
            opacity: 0.85;
        }

        .cart-count {
            background: #fff;
            color: var(--text-primary);
            padding: 1px 6px;
            border-radius: 10px;
            font-size: 0.75rem;
        }

        /* HERO SECTION */
        .hero {
            padding: 4rem 5% 3rem;
            text-align: center;
            max-width: 900px;
            margin: 0 auto;
        }

        .hero-logo-display {
            width: 90px;
            height: 90px;
            background: var(--text-primary);
            color: #fff;
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            font-weight: 800;
            margin: 0 auto 1.5rem;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
        }

        .hero h1 {
            font-size: clamp(2.2rem, 4.5vw, 3.2rem);
            font-weight: 800;
            letter-spacing: -0.03em;
            line-height: 1.15;
            margin-bottom: 1rem;
        }

        .hero p {
            font-size: 1.05rem;
            color: var(--text-secondary);
            max-width: 600px;
            margin: 0 auto 2rem;
        }

        .hero-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
